name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что ассеты собраны
        run: |
          test -f web/data/manifest.json || {
            echo "::error::web/data/manifest.json отсутствует. Запустите scripts/prepare.py локально и закоммитьте web/data/."
            exit 1
          }
          echo "Размер ассетов: $(du -sh web/data | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
